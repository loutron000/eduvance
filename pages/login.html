<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign In | Eduvance</title>

    <link rel="icon" href="../favicon.ico" sizes="any">

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>

  <body class="auth-page">
    <header class="auth-header">
      <div class="container">
        <a
          href="../index.html"
          class="navbar-brand"
          id="logoLink"
          aria-label="Eduvance home"
        >
          <img src="../assets/logo/logo.jpg" alt="" class="brand-logo" />

          <span class="brand-wordmark" aria-hidden="true">
            <span class="brand-edu">EDU</span
            ><span class="brand-vance">VANCE</span>
          </span>
        </a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="login-title">
        <div class="auth-heading">
          <h1 id="login-title">Welcome back</h1>
          <p>Sign in to continue exploring your future.</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="loginEmail">Email address</label>
            <input
              type="email"
              id="loginEmail"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>

            <div class="password-input-wrap">
              <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />

              <button
                type="button"
                class="password-toggle"
                data-password-toggle="loginPassword"
                aria-controls="loginPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <p
            id="loginMessage"
            class="auth-message"
            role="alert"
            aria-live="polite"
          ></p>

          <button type="submit" class="btn btn-primary auth-submit">
            Sign in
          </button>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a href="signup.html">Create one</a>
        </p>
      </section>
    </main>

    <footer class="auth-footer">
      <p>&copy; 2026 Eduvance. Explore. Understand. Move forward.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>

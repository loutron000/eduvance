<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Your Account | Eduvance</title>

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>

  <body class="auth-page">
    <header class="auth-header">
      <div class="container">
        <a
          href="../index.html"
          class="navbar-brand"
          id="logoLink"
          aria-label="Eduvance home"
        >
          <img src="../assets/logo/logo.jpg" alt="" class="brand-logo" />

          <span class="brand-wordmark" aria-hidden="true">
            <span class="brand-edu">EDU</span
            ><span class="brand-vance">VANCE</span>
          </span>
        </a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="signup-title">
        <div class="auth-heading">
          <h1 id="signup-title">Create your account</h1>
          <p>Start exploring your future with Eduvance.</p>
        </div>

        <form id="signupForm" novalidate>
          <div class="form-group">
            <label for="signupName">Full name</label>
            <input
              type="text"
              id="signupName"
              name="name"
              placeholder="Enter your full name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="signupEmail">Email address</label>
            <input
              type="email"
              id="signupEmail"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>

            <div class="password-input-wrap">
              <input
                type="password"
                id="signupPassword"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="8"
                required
              />

              <button
                type="button"
                class="password-toggle"
                data-password-toggle="signupPassword"
                aria-controls="signupPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>

            <p class="form-helper">
              Choose a password you can remember, and avoid reusing one from
              another account.
            </p>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>

            <div class="password-input-wrap">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Enter your password again"
                autocomplete="new-password"
                minlength="8"
                required
              />

              <button
                type="button"
                class="password-toggle"
                data-password-toggle="confirmPassword"
                aria-controls="confirmPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <p
            id="signupMessage"
            class="auth-message"
            role="alert"
            aria-live="polite"
          ></p>

          <button type="submit" class="btn btn-primary auth-submit">
            Create account
          </button>
        </form>

        <p class="auth-switch">
          Already have an account?
          <a href="login.html">Sign in</a>
        </p>
      </section>
    </main>

    <footer class="auth-footer">
      <p>&copy; 2026 Eduvance. Explore. Understand. Move forward.</p>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
